[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynavid"
version = "0.1.0"
description = "DynaVid: Learning to Generate Highly Dynamic Videos using Synthetic Motion Data"
authors = [
    { name = "DynaVid Authors" }
]
license = { file = "LICENSE.txt" }
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "opencv-python>=4.9.0.80",
    "diffusers==0.35.1",
    "transformers==4.51.3",
    "tokenizers>=0.20.3",
    "accelerate>=1.1.1",
    "tqdm",
    "imageio",
    "easydict",
    "ftfy",
    "dashscope",
    "imageio-ffmpeg",
    "flash_attn==2.7.3",
    "numpy>=1.23.5,<2",
    "torchaudio",
    "peft==0.17.0",
    "timm",
    "h5py",
    "einops",
    "safetensors",
    "pydantic>=2,<3",
    "decord>=0.6.0",
    "wandb",
    "Pillow",
    "sentencepiece"
]

[project.optional-dependencies]
train = ["deepspeed"]
dev = [
    "pytest",
    "black",
    "flake8",
    "isort",
    "mypy",
    "huggingface-hub[cli]"
]

[project.urls]
homepage = "https://jinwonjoon.github.io/DynaVid/"
repository = "https://github.com/JinWonjoon/DynaVid"

[tool.setuptools.packages.find]
include = ["wan*", "training*", "inference*"]

[tool.setuptools.package-data]
"wan" = ["**/*.py"]
"training" = ["**/*.yaml", "**/*.sh"]
"inference" = ["scripts/*.sh"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.mypy]
strict = true
